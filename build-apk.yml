name: Build FocusGuard APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Assemble Android Flutter project
        run: |
          set -e
          flutter create --org com.focusguard --project-name focusguard --platforms=android build_app
          rm -rf build_app/lib build_app/test
          cp -r lib build_app/
          cp -r assets build_app/
          cp pubspec.yaml build_app/
          cp -r android_overlay/app/src/main/* build_app/android/app/src/main/

          # Enforce minSdk 24, compileSdk 34, targetSdk 34 cleanly
          GRADLE_FILE=$(ls build_app/android/app/build.gradle* | head -n 1)
          echo "Patching $GRADLE_FILE"
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' "$GRADLE_FILE"
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' "$GRADLE_FILE"
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' "$GRADLE_FILE"
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' "$GRADLE_FILE"
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' "$GRADLE_FILE"
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' "$GRADLE_FILE"

      - name: Install Dart dependencies & build Release APK
        working-directory: build_app
        run: |
          set -e
          flutter pub get
          flutter analyze --no-fatal-infos || true
          flutter build apk --release --split-per-abi
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload FocusGuard APK (Universal + ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-APK
          path: |
            build_app/build/app/outputs/flutter-apk/app-release.apk
            build_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
