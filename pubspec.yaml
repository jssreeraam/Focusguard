name: focusguard
description: FocusGuard — The Digital Study Warden. Offline-first on-device AI study proctor with anti-tamper app lockdown.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  camera: ^0.10.6
  google_mlkit_face_detection: ^0.11.0
  google_mlkit_image_labeling: ^0.12.0
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  wakelock_plus: ^1.2.8

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
